<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101421"><title>Мой трекер</title><style>
:root{--bg:#101421;--card:#1b2233;--card2:#252e43;--text:#f6f4f0;--muted:#aab4c6;--line:#364055;--accent:#a7a4ff;--good:#79d5ad;--warn:#f3c574;--bad:#ed8792}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:22px 18px 12px;max-width:760px;margin:auto}h1{font-size:27px;letter-spacing:-.04em;margin:0}h2{font-size:20px;letter-spacing:-.03em;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.sub,.muted,small{color:var(--muted)}main{max-width:760px;margin:auto;padding:0 15px}.card{background:var(--card);border:1px solid #ffffff12;border-radius:19px;padding:17px;margin:12px 0;box-shadow:0 4px 18px #00000011}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>div{min-width:0}.stack{display:grid;gap:9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{background:var(--card);border:1px solid #ffffff12;border-radius:18px;padding:16px;text-align:left;color:var(--text);min-height:100px}.tile b{display:block;margin:8px 0 2px}.pill{border-radius:999px;background:var(--card2);color:var(--accent);padding:5px 9px;font-size:12px;white-space:nowrap}.btn{border:0;border-radius:12px;background:var(--accent);color:#15162a;padding:10px 14px;font-weight:700}.ghost{border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--text);padding:8px 11px}.danger{color:var(--bad)}.tiny{padding:5px 8px;font-size:13px}.entry{padding:11px 0;border-bottom:1px solid var(--line)}.entry:last-child{border:0;padding-bottom:0}.check{display:flex;gap:11px;align-items:center;min-width:0}.check input{width:19px;height:19px;accent-color:var(--good);flex:none}.done{text-decoration:line-through;color:var(--muted)}.meter{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--good)}.section-link{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:12px 0;border-bottom:1px solid var(--line)}.section-link:last-child{border:0}nav{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:3px;background:#171e2cf2;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}nav button{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:7px 12px;font-size:12px;min-width:67px}nav button.active{background:var(--card2);color:var(--text)}nav span{display:block;font-size:20px}dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;width:min(94vw,470px);max-height:85vh;padding:20px;overflow:auto}dialog::backdrop{background:#000a}label.field{display:block;color:var(--muted);font-size:13px;margin:12px 0}input:not([type=checkbox]),select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;margin-top:5px;outline:none}textarea{min-height:70px}input:focus,textarea:focus,select:focus{border-color:var(--accent)}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);padding:7px 10px}.chip.on{outline:2px solid var(--accent)}.notice{background:#403d29;color:#f5dfa8;border-radius:12px;padding:12px;margin:10px 0}.empty{color:var(--muted);padding:10px 0}.back{border:0;background:none;color:var(--accent);padding:3px 0 14px}.money{font-size:26px;font-weight:750}.inline{display:flex;gap:8px;align-items:center}.inline input{width:75px!important}.kicker{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.tag{font-size:12px;color:var(--muted)}
</style></head><body><header><div class="kicker">Личное пространство</div><h1 id="title">Мой трекер</h1><div class="sub" id="subtitle"></div></header><main id="app"></main><nav id="nav"></nav><dialog id="modal"><h2 id="modalTitle"></h2><form id="form"></form></dialog><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
'use strict';const KEY='personal-tracker-v1';const today=()=>{let d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());const sections=[['study','Учёба','📚'],['work','Работа','💼'],['sport','Спорт','🏃'],['care','Уход и здоровье','🌿'],['people','Друзья и семья','💌'],['hobby','Хобби','🍳'],['budget','Бюджет','💰'],['home','Домашние дела','🏠'],['todo','Общие дела','☑️'],['films','Фильмы','🎬']];const defaults=()=>({version:1,subjects:[],entries:[],students:[],sessions:[],income:[],allocations:[],settings:{}});let db;try{db={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=defaults()}for(const key of ['subjects','entries','students','sessions','income','allocations'])if(!Array.isArray(db[key]))db[key]=[];let page='home',detail='',editing=null,filterMonth=new Date().toISOString().slice(0,7);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(+n||0);const money=n=>fmt(n)+' ₽';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Не удалось сохранить данные. Экспортируйте резервную копию.')}};const add=(type,obj)=>{db.entries.push({id:uid(),type,created:today(),...obj});save();render()};const E=(type)=>db.entries.filter(x=>x.type===type);const subject=id=>db.subjects.find(x=>x.id===id);const nav=()=>{$('#nav').innerHTML=[['home','Главная','⌂'],['study','Учёба','▤'],['work','Работа','◷'],['budget','Бюджет','₽'],['more','Ещё','☷']].map(([k,n,i])=>`<button data-nav="${k}" class="${(page===k||page==='detail'&&k==='more')?'active':''}"><span>${i}</span>${n}</button>`).join('')};function render(){nav();$('#title').textContent=page==='detail'?sections.find(x=>x[0]===detail)?.[1]:({home:'Сегодня',study:'Учёба',work:'Работа',budget:'Бюджет',more:'Разделы'})[page];$('#subtitle').textContent=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',weekday:'long'}).format(new Date());$('#app').innerHTML=page==='home'?home():page==='study'?study():page==='work'?work():page==='budget'?budget():page==='more'?more():other(detail)}const card=(title,body,action='')=>`<section class="card"><div class="row"><h2>${title}</h2>${action}</div>${body}</section>`;const empty=t=>`<div class="empty">${t}</div>`;const btn=(label,action)=>`<button class="ghost tiny" data-action="${action}">${label}</button>`;const entry=(x,opts={})=>`<div class="entry row"><label class="check"><input type="checkbox" data-toggle="${x.id}" ${x.done?'checked':''}><span class="${x.done?'done':''}">${esc(x.title)}${x.date?`<br><small>${esc(x.date)}${x.time?' · '+esc(x.time):''}</small>`:''}</span></label><div>${opts.extra||''}${btn('⋯','edit:'+x.id)}</div></div>`;const list=(type)=>E(type).sort((a,b)=>(a.done-b.done)||String(a.date||'').localeCompare(b.date||'')).map(x=>entry(x)).join('')||empty('Пока пусто');function home(){let due=db.entries.filter(x=>x.date===today()&&!x.done);let daily=['language_en','language_fr','reading','food'].map(t=>E(t).find(x=>x.date===today()));return card('Сегодня',`<div class="stack">${due.length?due.map(x=>entry(x)).join(''):empty('Срочных дел на сегодня нет')}${daily.map((x,i)=>`<div class="row entry"><span>${['Английский · 30 минут','Французский · 30 минут','Чтение','Питание'][i]}</span>${x?`<span class="pill">${esc(x.value||'Отмечено')}</span>`:btn('Отметить', 'daily:'+['language_en','language_fr','reading','food'][i])}</div>`).join('')}</div>`,btn('+ Дело','new:todo'))+card('Быстрый доступ',`<div class="grid">${sections.map(([k,n,i])=>`<button class="tile" data-open="${k}"><span>${i}</span><b>${n}</b><small>Открыть →</small></button>`).join('')}</div>`)+`<div class="notice">Данные хранятся только на этом устройстве. Сохраняйте резервную копию в разделе «Ещё».</div>`}
function study(){let subs=['exam','credit'].map(kind=>card(kind==='exam'?'Экзамены':'Зачёты',db.subjects.filter(s=>s.kind===kind).map(s=>`<button class="section-link" data-subject="${s.id}"><div class="row"><strong>${esc(s.name)}</strong><span class="pill">${s.metrics?.length||0} показателей</span></div></button>`).join('')||empty('Добавьте предмет'),btn('+ Предмет','subject:'+kind))).join('');return subs+card('Языки',`<div class="grid"><button class="tile" data-open="languages">🇬🇧<b>Английский</b></button><button class="tile" data-open="french">🇫🇷<b>Французский</b></button></div>`)+card('Дополнительные курсы',list('course'),btn('+ Курс','new:course'))+card('Стажировка · вузы',list('university'),btn('+ Вуз','new:university'))}
function subjectView(id){let s=subject(id);if(!s)return empty('Предмет не найден');let metrics=s.metrics||[];return `<button class="back" data-back="study">← Учёба</button>${card(esc(s.name),`<div class="muted">${s.kind==='exam'?'Экзамен':'Зачёт'}</div>${s.note?`<p>${esc(s.note)}</p>`:''}`,btn('Изменить','subjectedit:'+id))}${metrics.map(m=>{let val=m.mode==='check'?E('metric').filter(x=>x.subjectId===id&&x.metricId===m.id&&x.done).length:(m.value||0),max=Number(m.max)||0;return card(esc(m.name),`<div class="row"><span class="money">${fmt(val)}${max?' / '+fmt(max):''}</span>${btn(m.mode==='check'?'+ Запись':'Изменить','metric:'+id+':'+m.id)}</div>${max?`<div class="meter"><i style="width:${Math.min(100,Math.max(0,100*val/max))}%"></i></div>`:''}${m.mode==='check'?E('metric').filter(x=>x.subjectId===id&&x.metricId===m.id).map(x=>entry(x)).join(''):''}`)}).join('')}${card('Показатели',empty('Добавляйте баллы, задания, пропуски или билеты.'),btn('+ Показатель','metricnew:'+id))}`}
function work(){let sessions=db.sessions.filter(x=>x.date?.startsWith(filterMonth));let sum=sessions.reduce((n,x)=>n+(+x.hours||0)*(+x.rate||0),0);let bonus=db.income.filter(x=>x.kind==='bonus'&&x.date?.startsWith(filterMonth)).reduce((n,x)=>n+(+x.amount||0),0);return `<div class="card row"><div><div class="muted">Заработано за ${esc(filterMonth)}</div><div class="money">${money(sum+bonus)}</div></div><input aria-label="Месяц" type="month" id="month" value="${esc(filterMonth)}" style="max-width:155px"></div>${card('Ученики',db.students.map(s=>`<div class="entry row"><div><b>${esc(s.name)}</b><br><small>${esc(s.group||'Работа')} · ${money(s.rate)}/ч</small></div>${btn('⋯','studentedit:'+s.id)}</div>`).join('')||empty('Добавьте учеников'),btn('+ Ученик','studentnew'))}${card('Занятия',sessions.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{let st=db.students.find(s=>s.id===x.studentId);return `<div class="entry row"><div><b>${esc(st?.name||'Ученик удалён')}</b><br><small>${esc(x.date)} · ${fmt(x.hours)} ч · ${esc(st?.group||'')}</small></div><div>${money(x.hours*x.rate)} ${btn('⋯','sessionedit:'+x.id)}</div></div>`}).join('')||empty('Занятий за месяц нет'),btn('+ Занятие','sessionnew'))}${card('Доплаты',db.income.filter(x=>x.kind==='bonus').map(x=>`<div class="entry row"><span>${esc(x.title)} · ${esc(x.date)}</span><span>${money(x.amount)} ${btn('⋯','incomeedit:'+x.id)}</span></div>`).join('')||empty('Доплат нет'),btn('+ Доплата','bonusnew'))}`}
function budget(){let sessionIncome=db.sessions.filter(x=>x.date?.startsWith(filterMonth)).reduce((n,x)=>n+x.hours*x.rate,0);let otherIncome=db.income.filter(x=>x.date?.startsWith(filterMonth)).reduce((n,x)=>n+(+x.amount||0),0);let spent=E('purchase').filter(x=>x.done&&x.date?.startsWith(filterMonth)).reduce((n,x)=>n+(+x.amount||0),0);return `<div class="card"><label class="field">Месяц<input type="month" id="month" value="${esc(filterMonth)}"></label><div class="grid"><div><small>Доход</small><div class="money">${money(sessionIncome+otherIncome)}</div></div><div><small>Покупки</small><div class="money">${money(spent)}</div></div></div><small>Зарплата из работы: ${money(sessionIncome)}; прочие поступления: ${money(otherIncome)}</small></div>${card('Покупки',E('purchase').filter(x=>!x.date||x.date.startsWith(filterMonth)).map(x=>entry(x,{extra:x.amount?`<span class="tag">${money(x.amount)} </span>`:''})).join('')||empty('Список пуст'),btn('+ Покупка','new:purchase'))}${card('Другие поступления',db.income.filter(x=>x.kind!=='bonus'&&x.date?.startsWith(filterMonth)).map(x=>`<div class="entry row"><span>${esc(x.title)}</span><span>${money(x.amount)} ${btn('⋯','incomeedit:'+x.id)}</span></div>`).join('')||empty('Нет поступлений'),btn('+ Доход','incomenew'))}${card('Распределение',db.allocations.filter(x=>x.month===filterMonth).map(x=>`<div class="entry row"><span>${esc(x.title)}</span><span>${money(x.amount)} ${btn('⋯','allocationedit:'+x.id)}</span></div>`).join('')||empty('Добавьте вклад, подарки или путешествия'),btn('+ Категория','allocationnew'))}`}
function more(){return `<div class="grid">${sections.filter(x=>!['study','work','budget'].includes(x[0])).map(([k,n,i])=>`<button class="tile" data-open="${k}">${i}<b>${n}</b></button>`).join('')}</div>${card('Резервная копия',`<p class="muted">Экспортируйте данные в JSON и храните копию отдельно. Импорт заменит данные на этом устройстве.</p><div class="chips">${btn('Скачать копию','export')}${btn('Восстановить','import')}</div><input type="file" id="importFile" accept="application/json,.json" hidden>`)}`}
function other(k){if(k==='subject')return subjectView(editing);let b=`<button class="back" data-back="more">← Разделы</button>`;if(k==='languages'||k==='french'){let fr=k==='french',code=fr?'fr':'en';return `<button class="back" data-back="study">← Учёба</button>${card(fr?'Французский':'Английский',`<p class="muted">Практика каждый день · цель 30 минут</p>${E('language_'+code).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="entry row"><span>${esc(x.date)}</span><span>${fmt(x.minutes)} мин ${btn('⋯','edit:'+x.id)}</span></div>`).join('')||empty('Пока нет записей')}`,btn('+ Практика','daily:language_'+code))}${card('Посещения занятий',list('class_'+code),btn('+ Посещение','new:class_'+code))}`}let configs={sport:[['latin','Латина'],['gym','Спортзал']],care:[['cosmetology','Косметолог'],['bath','Баня'],['sauna','Сауна и хаммам'],['food','Питание']],people:[['event','События и даты']],hobby:[['reading','Чтение'],['cooking','Приготовить'],['freezer','Заготовки']],home:[['chore','Домашние дела']],todo:[['todo','Общие задачи']],films:[['film','Фильмы']]};if(!configs[k])return b+empty('Раздел не найден');return b+configs[k].map(([type,label])=>card(label,type==='food'?foodView():type==='reading'?readingView():type==='latin'?timedView(type):list(type),btn('+ Добавить',type==='food'||type==='reading'?'daily:'+type:'new:'+type))).join('')}
function foodView(){return E('food').slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="entry row"><span>${esc(x.date)}</span><span class="pill">${esc(x.value||'—')} ${btn('⋯','edit:'+x.id)}</span></div>`).join('')||empty('Нет отметок')};function readingView(){return E('reading').slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="entry row"><span>${esc(x.date)} · ${esc(x.title||'Чтение')}</span>${btn('⋯','edit:'+x.id)}</div>`).join('')||empty('Нет отметок')};function timedView(type){return E(type).slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="entry row"><span>${esc(x.date)} · ${fmt(x.hours||0)} ч</span>${btn('⋯','edit:'+x.id)}</div>`).join('')||empty('Нет посещений')}
const field=(label,name,value='',type='text',required=false)=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;const textfield=(label,name,value='')=>`<label class="field">${label}<textarea name="${name}">${esc(value)}</textarea></label>`;function modal(title,html,submit){$('#modalTitle').textContent=title;$('#form').innerHTML=html+`<div class="actions"><button type="button" class="ghost" id="cancel">Отмена</button><button type="submit" class="btn">Сохранить</button></div>`;$('#modal').showModal();$('#cancel').onclick=()=>$('#modal').close();$('#form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));submit(v);save();$('#modal').close();render()}}
function editEntry(type,id){let x=id?db.entries.find(e=>e.id===id):null;if(!x&&id)return;type=x?.type||type;let title=type==='film'?'Фильм':type==='university'?'Вуз':type==='event'?'Событие':type==='purchase'?'Покупка':type==='course'?'Курс':'Запись';if(type==='food')return modal('Питание',field('Дата','date',x?.date||today(),'date',true)+`<label class="field">Оценка<select name="value">${['Зелёный · хорошо','Жёлтый · средне','Красный · плохо','Читмил'].map(a=>`<option ${x?.value===a?'selected':''}>${a}</option>`).join('')}</select></label>`,v=>upEntry(x,type,v));if(type.startsWith('language_'))return modal('Практика языка',field('Дата','date',x?.date||today(),'date',true)+field('Минуты','minutes',x?.minutes||30,'number',true),v=>upEntry(x,type,v));let html=field(title==='Запись'?'Название':title,'title',x?.title||'','text',true);if(type==='university')html+=field('Страна и город','place',x?.place||'')+textfield('Требования','note',x?.note||'');else if(type==='course')html+=field('Всего уроков / лекций','max',x?.max||'','number')+field('Пройдено','value',x?.value||0,'number');else if(type==='film')html+=`<label class="field">Статус<select name="status"><option ${x?.status==='Посмотреть'?'selected':''}>Посмотреть</option><option ${x?.status==='Посмотрено'?'selected':''}>Посмотрено</option></select></label>`;else if(type==='purchase')html+=field('Стоимость, ₽','amount',x?.amount||'','number')+field('Месяц покупки','date',x?.date||today(),'date');else if(type==='reading')html+=field('Дата','date',x?.date||today(),'date');else if(type==='latin')html+=field('Дата','date',x?.date||today(),'date')+field('Часы','hours',x?.hours||1,'number');else html+=field('Дата','date',x?.date||'','date')+(type==='event'?field('Время (необязательно)','time',x?.time||'','time'):'')+textfield('Заметка','note',x?.note||'');html+=x?`<button type="button" class="ghost danger" id="deleteEntry">Удалить</button>`:'';modal(title,html,v=>upEntry(x,type,v));let del=$('#deleteEntry');if(del)del.onclick=()=>{if(confirm('Удалить запись?')){db.entries=db.entries.filter(e=>e.id!==x.id);save();$('#modal').close();render()}}}
function upEntry(x,type,v){if(x)Object.assign(x,v);else db.entries.push({id:uid(),type,created:today(),done:false,...v});if(type==='film'&&v.status==='Посмотрено')db.entries.find(e=>e.id===(x?.id||db.entries.at(-1).id)).done=true}
function subjectForm(kind,id){let s=id?subject(id):null;modal(s?'Предмет':'Новый предмет',field('Название','name',s?.name||'','text',true)+`<label class="field">Тип<select name="kind"><option value="exam" ${(s?.kind||kind)==='exam'?'selected':''}>Экзамен</option><option value="credit" ${(s?.kind||kind)==='credit'?'selected':''}>Зачёт</option></select></label>`+textfield('Условия и заметки','note',s?.note||'')+(s?`<button type="button" class="ghost danger" id="deleteSubject">Удалить предмет</button>`:''),v=>{if(s)Object.assign(s,v);else db.subjects.push({id:uid(),metrics:[],...v})});let d=$('#deleteSubject');if(d)d.onclick=()=>{if(confirm('Удалить предмет и его показатели?')){db.subjects=db.subjects.filter(z=>z.id!==id);db.entries=db.entries.filter(z=>z.subjectId!==id);save();$('#modal').close();page='study';render()}}}
function metricForm(sid,mid){let s=subject(sid),m=s?.metrics?.find(x=>x.id===mid);if(!s)return;modal(m?'Показатель':'Новый показатель',field('Название (например, Контрольная)','name',m?.name||'','text',true)+`<label class="field">Вид<select name="mode"><option value="number" ${m?.mode==='number'?'selected':''}>Число / баллы</option><option value="check" ${m?.mode==='check'?'selected':''}>Список с отметками</option></select></label>`+field('Максимум (необязательно)','max',m?.max||'','number')+field('Текущее значение','value',m?.value||0,'number')+(m?`<button type="button" class="ghost danger" id="deleteMetric">Удалить показатель</button>`:''),v=>{if(m)Object.assign(m,v);else s.metrics.push({id:uid(),...v})});let d=$('#deleteMetric');if(d)d.onclick=()=>{if(confirm('Удалить показатель?')){s.metrics=s.metrics.filter(x=>x.id!==mid);db.entries=db.entries.filter(x=>x.metricId!==mid);save();$('#modal').close();render()}}}
function metricValue(sid,mid){let m=subject(sid)?.metrics?.find(x=>x.id===mid);if(!m)return;if(m.mode==='check')return editEntryMetric(sid,mid);modal('Значение · '+m.name,field('Текущее значение','value',m.value||0,'number',true),v=>{m.value=+v.value})}function editEntryMetric(sid,mid){modal('Новая отметка',field('Название задания / билета','title','','text',true)+field('Дата','date',today(),'date'),v=>db.entries.push({id:uid(),type:'metric',subjectId:sid,metricId:mid,done:true,...v}))}
function studentForm(id){let s=db.students.find(x=>x.id===id);modal(s?'Ученик':'Новый ученик',field('Имя','name',s?.name||'','text',true)+field('Группа / направление','group',s?.group||'')+field('Ставка, ₽/ч','rate',s?.rate||0,'number',true)+(s?`<button type="button" class="ghost danger" id="del">Удалить ученика</button>`:''),v=>{if(s)Object.assign(s,v);else db.students.push({id:uid(),...v})});let d=$('#del');if(d)d.onclick=()=>{if(confirm('Удалить ученика? История занятий останется.')){db.students=db.students.filter(x=>x.id!==id);save();$('#modal').close();render()}}}
function sessionForm(id){let s=db.sessions.find(x=>x.id===id);if(!db.students.length){alert('Сначала добавьте ученика.');return}modal('Занятие',`<label class="field">Ученик<select name="studentId">${db.students.map(x=>`<option value="${x.id}" ${s?.studentId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`+field('Дата','date',s?.date||today(),'date',true)+field('Часы','hours',s?.hours||1,'number',true)+field('Ставка за занятие, ₽/ч','rate',s?.rate??db.students[0].rate,'number',true)+(s?`<button type="button" class="ghost danger" id="del">Удалить</button>`:''),v=>{let selected=db.students.find(x=>x.id===v.studentId);if(!s&&!v.rate)v.rate=selected?.rate||0;if(s)Object.assign(s,v);else db.sessions.push({id:uid(),...v})});let sel=$('#form select[name=studentId]'),rate=$('#form input[name=rate]');if(!s)sel.onchange=()=>rate.value=db.students.find(x=>x.id===sel.value)?.rate||0;let d=$('#del');if(d)d.onclick=()=>{if(confirm('Удалить занятие?')){db.sessions=db.sessions.filter(x=>x.id!==id);save();$('#modal').close();render()}}}
function incomeForm(kind,id){let x=db.income.find(z=>z.id===id);modal(kind==='bonus'?'Доплата':'Поступление',field('Название','title',x?.title||'','text',true)+field('Дата','date',x?.date||today(),'date',true)+field('Сумма, ₽','amount',x?.amount||0,'number',true)+(x?`<button type="button" class="ghost danger" id="del">Удалить</button>`:''),v=>{if(x)Object.assign(x,v);else db.income.push({id:uid(),kind,...v})});let d=$('#del');if(d)d.onclick=()=>{if(confirm('Удалить поступление?')){db.income=db.income.filter(z=>z.id!==id);save();$('#modal').close();render()}}}
function allocationForm(id){let x=db.allocations.find(z=>z.id===id);modal('Распределение',field('Цель','title',x?.title||'','text',true)+field('Месяц','month',x?.month||filterMonth,'month',true)+field('Сумма, ₽','amount',x?.amount||0,'number',true)+(x?`<button type="button" class="ghost danger" id="del">Удалить</button>`:''),v=>{if(x)Object.assign(x,v);else db.allocations.push({id:uid(),...v})});let d=$('#del');if(d)d.onclick=()=>{if(confirm('Удалить распределение?')){db.allocations=db.allocations.filter(z=>z.id!==id);save();$('#modal').close();render()}}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tracker-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#app').addEventListener('click',e=>{let t=e.target.closest('[data-action],[data-open],[data-subject],[data-back]');if(!t)return;if(t.dataset.open){detail=t.dataset.open;page=['study','work','budget'].includes(detail)?detail:'detail';render();return}if(t.dataset.subject){editing=t.dataset.subject;detail='subject';page='detail';render();return}if(t.dataset.back){page=t.dataset.back;render();return}let a=t.dataset.action||'',v=a.split(':');if(v[0]==='new'||v[0]==='daily')editEntry(v[1]);else if(v[0]==='edit')editEntry('',v[1]);else if(v[0]==='subject')subjectForm(v[1]);else if(v[0]==='subjectedit')subjectForm('',v[1]);else if(v[0]==='metricnew')metricForm(v[1]);else if(v[0]==='metric')metricValue(v[1],v[2]);else if(v[0]==='studentnew')studentForm();else if(v[0]==='studentedit')studentForm(v[1]);else if(v[0]==='sessionnew')sessionForm();else if(v[0]==='sessionedit')sessionForm(v[1]);else if(v[0]==='bonusnew')incomeForm('bonus');else if(v[0]==='incomenew')incomeForm('other');else if(v[0]==='incomeedit')incomeForm('',v[1]);else if(v[0]==='allocationnew')allocationForm();else if(v[0]==='allocationedit')allocationForm(v[1]);else if(a==='export')exportData();else if(a==='import')$('#importFile').click()});$('#app').addEventListener('change',e=>{if(e.target.dataset.toggle){let x=db.entries.find(z=>z.id===e.target.dataset.toggle);if(x){x.done=e.target.checked;save();render()}}else if(e.target.id==='month'){filterMonth=e.target.value;render()}else if(e.target.id==='importFile'){let f=e.target.files[0];if(!f)return;f.text().then(s=>{let data=JSON.parse(s);if(!data||!Array.isArray(data.entries)||!Array.isArray(data.subjects)||!Array.isArray(data.sessions)||!Array.isArray(data.students)||!Array.isArray(data.income)||!Array.isArray(data.allocations))throw Error('Неверный формат');if(confirm('Заменить все текущие данные резервной копией?')){let previous=db;db={...defaults(),...data,settings:{...defaults().settings,...(data.settings||{})}};try{localStorage.setItem(KEY,JSON.stringify(db));render()}catch(err){db=previous;throw err}}}).catch(()=>alert('Не удалось прочитать резервную копию.'))}});$('#nav').onclick=e=>{let b=e.target.closest('[data-nav]');if(b){page=b.dataset.nav;render()}};try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch{}render();
</script></body></html>
