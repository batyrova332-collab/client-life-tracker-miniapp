on:line-through;color:var(--muted)}.meter{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--good)}.section-link{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:12px 0;border-bottom:1px solid var(--line)}.section-link:last-child{border:0}nav{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:3px;background:#171e2cf2;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}nav button{border:0;background:transparent;color:var(--muted);border-radius:11px;padding:7px 12px;font-size:12px;min-width:67px}nav button.active{background:var(--card2);color:var(--text)}nav span{display:block;font-size:20px}dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;width:min(94vw,470px);max-height:85vh;padding:20px;overflow:auto}dialog::backdrop{background:#000a}label.field{display:block;color:var(--muted);font-size:13px;margin:12px 0}input:not([type=checkbox]),select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;margin-top:5px;outline:none;min-width:0;max-width:100%;font-size:16px}input[type=month]{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}textarea{min-height:70px}input:focus,textarea:focus,select:focus{border-color:var(--accent)}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--text);padding:7px 10px}.chip.on{outline:2px solid var(--accent)}.notice{background:#403d29;color:#f5dfa8;border-radius:12px;padding:12px;margin:10px 0}.empty{color:var(--muted);padding:10px 0}.back{border:0;background:none;color:var(--accent);padding:3px 0 14px}.money{font-size:26px;font-weight:750}.inline{display:flex;gap:8px;align-items:center}.inline input{width:75px!important}.kicker{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}.tag{font-size:12px;color:var(--muted)}

/* Light, calm visual system */
:root{--bg:#f6f5f2;--card:#ffffff;--card2:#f2f1ed;--text:#252b30;--muted:#747e87;--line:#e7e8e5;--accent:#5d706a;--good:#5c8a73;--warn:#b68a51;--bad:#b66767;color-scheme:light}

'use strict';const KEY='personal-tracker-v1';const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());const sections=[['study','Учёба','📚'],['work','Работа','💼'],['sport','Спорт','🏃'],['care','Уход и здоровье','🌿'],['people','Друзья и семья','💌'],['hobby','Хобби','🍳'],['budget','Бюджет','💰'],['home','Домашние дела','🏠'],['todo','Общие дела','☑️'],['films','Фильмы','🎬']];const defaults=()=>({version:2,subjects:[],entries:[],students:[],sessions:[],income:[],allocations:[],settings:{reminderUrl:'',daily:[]}});let db;try{db={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=defaults()}for(const key of ['subjects','entries','students','sessions','income','allocations'])if(!Array.isArray(db[key]))db[key]=[];if((+db.version||1)<2){if(JSON.stringify(db.settings?.daily)===JSON.stringify(['language_en','language_fr','reading','food']))db.settings.daily=[];db.version=2;try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}let page='home',detail='',editing=null,filterMonth=new Date().toISOString().slice(0,7);const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(+n||0);const money=n=>fmt(n)+' ₽';const monthPicker=()=>{let y=Number(filterMonth.slice(0,4)),m=Number(filterMonth.slice(5))-1;return `<select id="month" aria-label="Месяц">${Array.from({length:25},(_,i)=>{let d=new Date(y,m+i-12,1),v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return `<option value="${v}" ${v===filterMonth?'selected':''}>${new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(d)}</option>`}).join('')}</select>`};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));scheduleSync()}catch{alert('Не удалось сохранить данные. Экспортируйте резервную копию.')}};let syncTimer;const scheduleSync=()=>{clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncReminders(false),600)};async function syncReminders(report){let url=db.settings?.reminderUrl?.replace(/\/$/,'');if(!url){if(report)alert('Сначала укажите адрес сервиса.');return}let initData=window.Telegram?.WebApp?.initData;if(!initData){if(report)alert('Откройте приложение внутри Telegram для подключения напоминаний.');return}try{let items=db.entries.filter(x=>x.date&&!x.done&&['event','todo','chore'].includes(x.type)).map(x=>({id:x.id,title:x.title,date:x.date,time:x.time||''}));let res=await fetch(url+'/reminders',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:JSON.stringify({items})});if(!res.ok)throw Error('HTTP '+res.status);if(report)alert('Напоминания обновлены.')}catch(err){if(report)alert('Не удалось подключить сервис: '+err.message)}}const add=(type,obj)=>{db.entries.push({id:uid(),type,created:today(),...obj});save();render()};const E=(type)=>db.entries.filter(x=>x.type===type);const subject=id=>db.subjects.find(x=>x.id===id);const nav=()=>{$('#nav').innerHTML=[['home','Главная','⌂'],['study','Учёба','▤'],['work','Работа','◷'],['budget','Бюджет','₽'],['more','Ещё','☷']].map(([k,n,i])=>`<button data-nav="${k}" class="${(page===k||page==='detail'&&k==='more')?'active':''}"><span>${i}</span>${n}</button>`).join('')};function render(){nav();$('#title').textContent=page==='detail'?sections.find(x=>x[0]===detail)?.[1]:({home:'Сегодня',study:'Учёба',work:'Работа',budget:'Бюджет',more:'Разделы'})[page];$('#subtitle').textContent=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',weekday:'long'}).format(new Date());$('#app').innerHTML=page==='home'?home():page==='study'?study():page==='work'?work():page==='budget'?budget():page==='more'?more():other(detail)}const card=(title,body,action='')=>`<section class="card"><div class="row"><h2>${title}</h2>${action}</div>${body}</section>`;const empty=t=>`<div class="empty">${t}</div>`;const btn=(label,action)=>`<button class="ghost tiny" data-action="${action}">${label}</button>`;const entry=(x,opts={})=>`<div class="entry row"><label class="check"><input type="checkbox" data-toggle="${x.id}" ${x.done?'checked':''}><span class="${x.done?'done':''}">${esc(x.title)}${x.date?`<br><small>${esc(x.date)}${x.time?' · '+esc(x.time):''}</small>`:''}</span></label><div>${opts.extra||''}${btn('⋯','edit:'+x.id)}</div></div>`;const list=(type)=>E(type).sort((a,b)=>(a.done-b.done)||String(a.date||'').localeCompare(b.date||'')).map(x=>entry(x)).join('')||empty('Пока пусто');const dailyNames={language_en:'Английский · 30 минут',language_fr:'Французский · 30 минут',reading:'Чтение',food:'Питание'};function dailyItems(){return Array.isArray(db.settings?.daily)?db.settings.daily:[]}function home(){let due=db.entries.filter(x=>x.date===today()&&!x.done);let daily=dailyItems();return card('Сегодня',`<div class="stack">${due.length?due.map(x=>entry(x)).join(''):empty('Срочных дел на сегодня нет')}${daily.length?'':empty('Ежедневных пунктов пока нет. Добавьте нужные через кнопку выше.')}${daily.map(t=>{let x=E(t).find(z=>z.date===today());return `<div class="row entry"><span>${esc(dailyNames[t]||t.replace('daily_custom_',''))}</span>${x?`<div class="inline"><span class="pill">${esc(x.value||'Отмечено')}</span>${btn('Убрать','dailyundo:'+x.id)}</div>`:btn('Отметить','daily:'+t)}</div>`}).join('')}</div>`,btn('+ Пункт','dailyconfig'))+card('Быстрый доступ',`<div class="grid">${sections.map(([k,n,i])=>`<button class="tile" data-open="${k}"><span>${i}</span><b>${n}</b><small>Открыть →</small></button>`).join('')}</div>`)+`<div class="notice">Данные хранятся только на этом устройстве. Сохраняйте резервную копию в разделе «Ещё».</div>`}function dailyConfig(){let all=[...Object.keys(dailyNames),...dailyItems().filter(x=>x.startsWith('daily_custom_'))];modal('Пункты на главной',`<p class="muted">Отметьте нужные пункты. Уберите галочку, чтобы удалить пункт с главной. Прежние записи останутся в разделах.</p>${all.map(t=>`<label class="entry check"><input type="checkbox" name="item" value="${esc(t)}" ${dailyItems().includes(t)?'checked':''}><span>${esc(dailyNames[t]||t.replace('daily_custom_',''))}</span></label>`).join('')}${field('Добавить свой пункт','custom','')}`,v=>{db.settings=db.settings||{};db.settings.daily=[...$('#form').querySelectorAll('input[name=item]:checked')].map(x=>x.value);let name=v.custom.trim();if(name)db.settings.daily.push('daily_custom_'+name)})}
function study(){let subs=['exam','credit'].map(kind=>card(kind==='exam'?'Экзамены':'Зачёты',db.subjects.filter(s=>s.kind===kind).map(s=>`<button class="section-link" data-subject="${s.id}"><div class="row"><strong>${esc(s.name)}</strong><span class="pill">${s.metrics?.length||0} показателей</span></div></button>`).join('')||empty('Добавьте предмет'),btn('+ Предмет','subject:'+kind))).join('');return subs+card('Языки',`<div class="grid"><button class="tile" data-open="languages">🇬🇧<b>Английский</b></button><button class="tile" data-open="french">🇫🇷<b>Французский</b></button></div>`)+card('Дополнительные курсы',list('course'),btn('+ Курс','new:course'))+card('Стажировка · вузы',list('university'),btn('+ Вуз','new:university'))}
function subjectView(id){let s=subject(id);if(!s)return empty('Предмет не найден');let metrics=s.metrics||[];return `<button class="back" data-back="study">← Учёба</button>${card(esc(s.name),`<div class="muted">${s.kind==='exam'?'Экзамен':'Зачёт'}</div>${s.note?`<p>${esc(s.note)}</p>`:''}`,btn('Изменить','subjectedit:'+id))}${metrics.map(m=>{let val=m.mode==='check'?E('metric').filter(x=>x.subjectId===id&&x.metricId===m.id&&x.done).length:(m.value||0),max=Number(m.max)||0;return card(esc(m.name),`<div class="row"><span class="money">${fmt(val)}${max?' / '+fmt(max):''}</span>${btn(m.mode==='check'?'+ Запись':'Изменить','metric:'+id+':'+m.id)}</div>${max?`<div class="meter"><i style="width:${Math.min(100,Math.max(0,100*val/max))}%"></i></div>`:''}${m.mode==='check'?E('metric').filter(x=>x.subjectId===id&&x.metricId===m.id).map(x=>entry(x)).join(''):''}`)}).join('')}${card('Показатели',empty('Добавляйте баллы, задания, пропуски или билеты.'),btn('+ Показатель','metricnew:'+id))}`}
function work(){let sessions=db.sessions.filter(x=>x.date?.startsWith(filterMonth));let sum=sessions.reduce((n,x)=>n+(+x.hours||0)*(+x.rate||0),0);let bonus=db.income.filter(x=>x.kind==='bonus'&&x.date?.startsWith(filterMonth)).reduce((n,x)=>n+(+x.amount||0),0);return `<div class="card row"><div><div class="muted">Заработано за ${esc(filterMonth)}</div><div class="money">${money(sum+bonus)}</div></div><div style="width:145px;flex:none">${monthPicker()}</div></div>${card('Ученики',db.students.map(s=>`<div class="entry row"><div><b>${esc(s.name)}</b><br><small>${esc(s.group||'Работа')} · ${money(s.rate)}/ч</small></div>${btn('⋯','studentedit:'+s.id)}</div>`).join('')||empty('Добавьте учеников'),btn('+ Ученик','studentnew'))}${card('Занятия',sessions.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{let st=db.students.find(s=>s.id===x.studentId);return `<div class="entry row"><div><b>${esc(st?.name||'Ученик удалён')}</b><br><small>${esc(x.date)} · ${fmt(x.hours)} ч · ${esc(st?.group||'')}</small></div><div>${money(x.hours*x.rate)} ${btn('⋯','sessionedit:'+x.id)}</div></div>`}).join('')||empty('Занятий за месяц нет'),btn('+ Занятие','sessionnew'))}${card('Доплаты',db.income.filter(x=>x.kind==='bonus').map(x=>`<div class="entry row"><span>${esc(x.title)} · ${esc(x.date)}</span><span>${money(x.amount)} ${btn('⋯','incomeedit:'+x.id)}</span></div>`).join('')||empty('Доплат нет'),btn('+ Доплата','bonusnew'))}`}
function budget(){let sessionIncome=db.sessions.filter(x=>x.date?.startsWith(filterMonth)).reduce((n,x)=>n+x.hours*x.rate,0);let otherIncome=db.income.filter(x=>x.date?.startsWith(filterMonth)).reduce((n,x)=>n+(+x.amount||0),0);let spent=E('purchase').filter(x=>x.done&&x.date?.startsWith(filterMonth)).reduce((n,x)=>n+(+x.amount||0),0);return `<div class="card"><label class="field">Месяц${monthPicker()}</label><div class="grid"><div><small>Доход</small><div class="money">${money(sessionIncome+otherIncome)}</div></div><div><small>Покупки</small><div class="money">${money(spent)}</div></div></div><small>Зарплата из работы: ${money(sessionIncome)}; прочие поступления: ${money(otherIncome)}</small></div>${card('Покупки',E('purchase').filter(x=>!x.date||x.date.startsWith(filterMonth)).map(x=>entry(x,{extra:x.amount?`<span class="tag">${money(x.amount)} </span>`:''})).join('')||empty('Список пуст'),btn('+ Покупка','new:purchase'))}${card('Другие поступления',db.income.filter(x=>x.kind!=='bonus'&&x.date?.startsWith(filterMonth)).map(x=>`<div class="entry row"><span>${esc(x.title)}</span><span>${money(x.amount)} ${btn('⋯','incomeedit:'+x.id)}</span></div>`).join('')||empty('Нет поступлений'),btn('+ Доход','incomenew'))}${card('Распределение',db.allocations.filter(x=>x.month===filterMonth).map(x=>`<div class="entry row"><span>${esc(x.title)}</span><span>${money(x.amount)} ${btn('⋯','allocationedit:'+x.id)}</span></div>`).join('')||empty('Добавьте вклад, подарки или путешествия'),btn('+ Категория','allocationnew'))}`}
function more(){return `<div class="grid">${sections.filter(x=>!['study','work','budget'].includes(x[0])).map(([k,n,i])=>`<button class="tile" data-open="${k}">${i}<b>${n}</b></button>`).join('')}</div>${card('Резервная копия',`<p class="muted">Экспортируйте данные в JSON и храните копию отдельно. Импорт заменит данные на этом устройстве.</p><div class="chips">${btn('Скачать копию','export')}${btn('Восстановить','import')}</div><input type="file" id="importFile" accept="application/json,.json" hidden>`)+card('Напоминания через бота',`<p class="muted">После размещения сервиса укажите его HTTPS-адрес. События с датой будут отправлять напоминание за день в 10:00 по Москве.</p><label class="field">Адрес сервиса<input id="reminderUrl" type="url" placeholder="https://example.com" value="${esc(db.settings?.reminderUrl||'')}"></label>${btn('Проверить и обновить','sync')}`)}`}
